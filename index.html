<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安本</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20261002a">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div id="login-screen" style="display:none;">
  <form id="login-form">
    <h1><img class="app-icon" src="img/logo-192.png" alt=""> 安本</h1>
    <p class="login-sub" id="login-sub">多人共用，登录后只看得到自己的东西</p>
    <div id="login-step-form">
      <div class="field" id="login-display-name-field" style="display:none;"><label>名字</label><input type="text" id="login-display-name" autocomplete="nickname"></div>
      <div class="field"><label>邮箱</label><input type="email" id="login-email" autocomplete="email" required></div>
      <div class="field" id="login-password-field"><label>密码</label><input type="password" id="login-password" autocomplete="current-password" required></div>
      <div class="field" id="login-password-confirm-field" style="display:none;"><label>确认密码</label><input type="password" id="login-password-confirm" autocomplete="new-password"></div>
    </div>
    <div id="login-step-otp" style="display:none;">
      <p class="login-sub" id="login-otp-hint" style="margin-bottom:12px;"></p>
      <div class="field"><label>邮箱验证码</label><input type="text" id="login-otp" inputmode="numeric" maxlength="8" autocomplete="one-time-code" placeholder="邮件里的数字验证码"></div>
      <div class="field" id="login-newpw-field" style="display:none;"><label>新密码</label><input type="password" id="login-newpw" autocomplete="new-password"></div>
      <div class="field" id="login-newpw2-field" style="display:none;"><label>确认新密码</label><input type="password" id="login-newpw2" autocomplete="new-password"></div>
    </div>
    <div id="login-error" class="login-error"></div>
    <button type="submit" class="btn" id="login-submit-btn" style="width:100%;">登录</button>
    <p class="login-toggle"><a href="#" id="login-mode-toggle">还没有账号？点这里注册</a></p>
    <p class="login-toggle" id="login-forgot-row"><a href="#" id="login-forgot-link">忘记密码？</a></p>
  </form>
</div>
<div id="app">
  <nav id="sidebar">
    <div id="sidebar-head">
      <h1><img class="app-icon" src="img/logo-192.png" alt=""><span class="app-title"> 安本</span></h1>
      <button id="sidebar-collapse-btn" title="收起/展开侧边栏">«</button>
    </div>
    <div id="nav-content">加载中...</div>
    <div id="sidebar-account">
      <span id="sidebar-username"></span>
      <a id="sidebar-change-pw" href="#" title="修改密码">🔑</a>
      <a id="sidebar-logout" href="#" title="退出登录">🚪</a>
    </div>
    <div id="sidebar-tagline">🌱 Small steps every day lead to big results.</div>
  </nav>
  <main id="main">
    <div id="main-inner">
      <div id="topbar">
        <div id="global-search">
          <span id="search-icon">🔍</span>
          <input type="text" id="search-input" placeholder="搜索交易/薪资/任务/项目/联系人/链接/日记/订阅/提醒...">
          <div id="search-results"></div>
        </div>
      </div>
      <div id="page-content">加载中...</div>
    </div>
  </main>
  <div id="sidebar-backdrop"></div>
  <nav id="bottom-nav">
    <a data-bottom="dashboard" href="#dashboard"><span class="icon">🏠</span>今日</a>
    <a data-bottom="tasks" href="#tasks"><span class="icon">✅</span>任务</a>
    <a data-bottom="habits" href="#habits"><span class="icon">🔁</span>习惯</a>
    <a data-bottom="transactions" href="#transactions"><span class="icon">💰</span>财务</a>
    <a data-bottom="more" href="#" id="bottom-more"><span class="icon">☰</span>更多</a>
  </nav>
</div>
<div id="modal-root"></div>
<script src="js/supabase_bridge.js?v=19"></script>
<script src="js/app.js?v=20261002d"></script>
</body>
</html>
